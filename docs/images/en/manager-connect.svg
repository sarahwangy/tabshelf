  <text x="40" y="50" font-size="22" font-weight="600" fill="#1a1a1a">Saved Links</text>
  <text x="40" y="70" font-size="12" fill="#6b7280"></text>

  <rect x="40" y="100" width="820" height="170" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-dasharray="6 5"/>
